# True color terminal for vim
set-option -sa terminal-features ",alacritty:RGB"

# keep bind amount to minimal
# default split - use current directory
bind '"' splitw -c '#{pane_current_path}'
# split for vim - small window (15 lines) at bottom
bind "'" splitw -c '#{pane_current_path}' -l15
bind S set synchronize-panes
bind y send-keys -l " set -o vi ; export PS1='\\e[32m\\]\\u@\\h:\\[\\e[33m\\]\\w\\[\\e[0m\\]\\n\\$ '" \; send-keys Enter
# panes tmux 3.3
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
#
set -g mouse on
set-option -g focus-events on
set-option -g history-limit 10000
# Clipboard
# set -s copy-command 'xsel -i'
if-shell '[ $XDG_SESSION_TYPE = wayland ]' "set -s copy-command wl-copy"
if-shell '[ $XDG_SESSION_TYPE = x11 ]' "set -s copy-command 'xsel -i'"
# vimode movements
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 
set-window-option -g mode-keys vi
# copy-paster via clip - for WSL - https://mitchellt.com/2020/04/01/copying-from-tmux-wsl-windows-terminal.html
# Plugins
source-file ~/.tmux_vim_navigator.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'laktak/extrakto'
# set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-logging'
# my fork - with support of tmux-logging
set -g @plugin 'PavelSlepushkin/tmux-menus#feature_tmux_logging'

# tmux-nvim - ctrl+hjkl movements
# set -g @plugin 'christoomey/vim-tmux-navigator'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
