# 256color terminal for vim
# set-option -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
# neovim checkhleath
set-option -sg escape-time 10
# keep bind amount to minimal
# default split - use current directory
bind '"' { splitw -c '#{pane_current_path}' } 
#
bind C new-window -a
#
# split for vim - small window (15 lines) at bottom
bind y send-keys -l " set -o emacs ; export PS1='\\e[32m\\]\\u@\\h:\\[\\e[33m\\]\\w\\[\\e[0m\\]\\n\\$ '" \; send-keys Enter
bind e send-keys -l "export KUBECONFIG=~/.kube/"
# copy to buffer
bind P run 'cat ~/notes/one-timepwd|pbcopy'
# kyriba user password to buffer - must be logged to vault
bind K run 'vault kv get -field=password secret/cloudops/shared/centos7-template/default-ssh-user |pbcopy'
# scroll limit
# set -g history-limit 10000
# toggle Logging for pane - when history is not enough :)
# panes tmux 3.3
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
#
set -g mouse on
# Clipboard - linux
# set -s copy-command 'xsel -i'
# vimode movements
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
set-window-option -g mode-keys vi
# copy-paster via clip - for WSL - https://mitchellt.com/2020/04/01/copying-from-tmux-wsl-windows-terminal.html
#
# shift+click - open hyperlinks
set -ga terminal-features "*:hyperlinks"
# try popup window
bind j if-shell -F '#{==:#{session_name},floating}' {
    detach-client
} { popup -E 'tmux attach -t floating || tmux new -s floating' }
#

#
# Plugins
source-file ~/.tmux_vim_navigator.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'laktak/extrakto'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-logging'

# tmux-nvim - ctrl+hjkl movements
# set -g @plugin 'christoomey/vim-tmux-navigator'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
